[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrap-mechanic-shader-toolchain"
version = "0.6.6"
description = "Extract and reconstruct HLSL modules from Scrap Mechanic shaders.sbc"
requires-python = ">=3.11"
dependencies = ["tqdm>=4.67"]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
sm-shaders = "shader_toolchain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shader_toolchain = ["recipes/assets/*.hlsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
